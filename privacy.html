  <h1>隱私權政策</h1>
  <p>NOVA 專案追蹤台是團隊內部使用的工具,僅供已獲授權的團隊成員存取。</p>
  <p>本工具透過 Google 帳號登入以驗證使用者身分,並使用 Google Drive 儲存使用者上傳的照片、使用 Firebase 儲存專案相關資料(任務、會議紀錄、待辦事項、對帳與物料資訊)。這些資料僅供團隊內部管理使用,不會提供給第三方或用於廣告用途。</p>
  <p>如對資料使用有任何疑問,請聯繫團隊管理者。</p>
